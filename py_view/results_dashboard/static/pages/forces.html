<section id="forces" class="section" aria-labelledby="forcesTitle">
      <div class="section-heading">
        <div><div class="section-index">03 / INTERNAL FORCE EXPLORER</div><h2 id="forcesTitle">全塔内力探索器</h2></div>
        <p>从 SQLite 读取任意记录时刻的内力分布，或统计自定义时间段包络；点击杆件可查看完整历程。</p>
      </div>
      <article class="panel force-panel">
        <div class="force-toolbar">
          <label><span>模型</span><select id="forceModel"><option value="equivalent">等效材料</option><option value="segmented_reference">四分段参考</option></select></label>
          <label><span>分量</span><select id="forceComponent"><option value="p">轴力 P</option><option value="vy">剪力 Vy</option><option value="vz">剪力 Vz</option><option value="t">扭矩 T</option><option value="my">弯矩 My</option><option value="mz">弯矩 Mz</option></select></label>
          <label><span>统计方式</span><select id="forceMode"><option value="snapshot">时刻分布</option><option value="envelope">时段包络</option></select></label>
          <label><span>投影</span><select id="forceProjection"><option value="xz">X–Z 正视</option><option value="yz">Y–Z 侧视</option></select></label>
          <button class="primary-button small" id="forceLoad">更新视图</button>
        </div>
        <div class="time-controls" id="snapshotControls">
          <span>记录步</span><input id="forceTime" type="range" min="0" max="0" value="0"><output id="forceTimeOutput">0</output>
        </div>
        <div class="time-controls hidden" id="envelopeControls">
          <span>时段</span><input id="forceStart" type="number" value="0" min="0"><b>—</b><input id="forceEnd" type="number" value="0" min="0"><small>记录步</small>
        </div>
        <div class="force-workspace">
          <div class="tower-map-wrap">
            <canvas id="forceMap"></canvas>
            <div class="map-overlay"><span id="forceViewLabel">正在读取…</span><b id="forceMemberCount">—</b></div>
            <div class="colorbar"><span id="colorMin">−</span><i></i><span id="colorMax">+</span></div>
            <div class="map-tooltip" id="mapTooltip"></div>
            <div class="loading" id="forceLoading"><i></i><span>查询内力数据库</span></div>
          </div>
          <aside class="member-inspector">
            <div class="inspector-empty" id="inspectorEmpty"><i>⌁</i><b>选择一根杆件</b><p>将鼠标移到塔身杆件上查看数值，点击后固定并读取全过程。</p></div>
            <div class="inspector-content hidden" id="inspectorContent">
              <span class="panel-kicker">MEMBER HISTORY</span>
              <h3 id="selectedMember">杆件 —</h3>
              <dl><div><dt>截面</dt><dd id="selectedSection">—</dd></div><div><dt>当前值</dt><dd id="selectedValue">—</dd></div><div><dt>节点</dt><dd id="selectedNodes">—</dd></div></dl>
              <div class="mini-chart"><canvas id="memberHistoryChart"></canvas></div>
              <small id="memberHistoryNote">点击塔身其他杆件可切换。</small>
            </div>
          </aside>
        </div>
        <footer class="force-note"><span><i class="blue"></i>负值</span><span><i class="neutral"></i>接近零</span><span><i class="red"></i>正值</span><p>时段包络显示绝对最大值；颜色上限采用 P98，极值仍在悬停信息中保留。</p></footer>
      </article>
    </section>
